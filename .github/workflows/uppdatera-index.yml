name: Uppdatera Rutindex

on:
  schedule:
    # Körs varje måndag kl 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch: # Gör det möjligt att starta manuellt från GitHubs gränssnitt

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checka ut koden
        uses: actions/checkout@v4

      - name: Konfigurera Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Kör bygg-index.py
        env:
          LM_USER: ${{ secrets.LM_USER }}
          LM_PASS: ${{ secrets.LM_PASS }}
        run: |
          python3 bygg-index.py

      - name: Committa och pusha ändringar
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/data/rutor.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Chore: Automatisk uppdatering av rutor.json" && git push)